---
name: Docs

# Builds the API docs and publishes them to GitHub Pages on every push to main,
# so the hosted docs track the tip of the default branch. Releases do not touch
# Pages; see release.yaml.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # A newer push to main supersedes an in-flight docs build/deploy.
  cancel-in-progress: true

jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-24.04
    steps:
      - name: git checkout
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-server-dev-18 libssl-dev libkrb5-dev
          echo "PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config" >>"$GITHUB_ENV"
      - name: Generate docs
        run: |
          zig build cli
          eval "$(./zig-out/bin/pgzx env)"
          zig build docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: zig-out/share/pgzx/docs

  deploy-docs:
    name: Deploy docs
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
