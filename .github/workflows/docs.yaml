---
name: Docs

# Builds the Starlight site in docs/ plus the Zig Autodoc bundle and publishes
# the merged result to GitHub Pages. Runs on every push to main, and is called
# by release.yaml so a broken docs build blocks a release and the tagged commit
# is what gets published.

on:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-24.04
    steps:
      - name: git checkout
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install PostgreSQL 19
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-server-dev-19 libssl-dev libkrb5-dev
          echo "PG_CONFIG=/usr/lib/postgresql/19/bin/pg_config" >>"$GITHUB_ENV"
      - name: Generate API docs
        run: |
          zig build cli
          eval "$(./zig-out/bin/pgzx env)"
          zig build docs
          # `bun run build` re-runs `zig build docs` through sync-api.ts, so the
          # environment it needs has to survive into the next step.
          {
            echo "PGZX_C_INCLUDE_DIRS=$PGZX_C_INCLUDE_DIRS"
            echo "ZIG_LOCAL_CACHE_DIR=$ZIG_LOCAL_CACHE_DIR"
          } >>"$GITHUB_ENV"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('docs/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install site dependencies
        working-directory: docs
        run: bun ci
      - name: Build site
        working-directory: docs
        run: bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy-docs:
    name: Deploy docs
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
