---
name: Release

# Runs when a version tag is pushed: re-runs the full check and creates a
# GitHub release. pgzx is consumed as a Zig package, so the release notes carry
# the `zig fetch` line (with the package hash) for the tagged source tarball.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yaml

  release:
    name: GitHub release
    needs: check
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - name: git checkout
        uses: actions/checkout@v7
      - name: Install PostgreSQL headers
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-server-dev-19 libssl-dev libkrb5-dev
          echo "PG_CONFIG=/usr/lib/postgresql/19/bin/pg_config" >>"$GITHUB_ENV"
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Compute the Zig package hash
        id: pkg
        env:
          TARBALL: ${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz
        run: |
          hash=$(zig fetch "$TARBALL" | tail -n 1)
          echo "tarball=$TARBALL" >>"$GITHUB_OUTPUT"
          echo "hash=$hash" >>"$GITHUB_OUTPUT"
      - name: Build distribution artifacts
        env:
          TAG: ${{ github.ref_name }}
          HASH: ${{ steps.pkg.outputs.hash }}
        run: ./tools/build-dist.sh --version "$TAG" --hash "$HASH"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pkg.outputs.tarball }}
          HASH: ${{ steps.pkg.outputs.hash }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$REPOSITORY/releases/download/$TAG/install.sh | sh"
            echo '```'
            echo
            echo "## Use this release in a Zig project"
            echo
            echo '```sh'
            echo "zig fetch --save=pgzx $TARBALL"
            echo '```'
            echo
            echo "Package hash: \`$HASH\`"
            echo
          } >notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS dist/install.sh
